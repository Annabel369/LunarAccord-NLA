<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Space & Lunar Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#000411"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>

    <!-- Emerald Bio-Shield Gradient -->
    <linearGradient id="emeraldGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#004b23"/>
      <stop offset="50%" stop-color="#38b000"/>
      <stop offset="100%" stop-color="#70e000"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring / Crest Boundary -->
  <circle cx="250" cy="250" r="240" fill="url(#spaceBg)" stroke="url(#goldGradient)" stroke-width="8"/>
  <circle cx="250" cy="250" r="225" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Lunar Hemisphere Arc -->
  <path d="M 50,250 A 200,200 0 0,0 450,250 Z" fill="#1a202c" opacity="0.4"/>

  <!-- Central Emerald Canopy (The Bio-Dome & Tree of Life) -->
  <g id="tree-of-life">
    <!-- Roots connecting to Lunar Regolith -->
    <path d="M 250,370 Q 230,410 200,420 M 250,370 Q 270,410 300,420 M 250,370 L 250,430" 
          stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Trunk -->
    <path d="M 242,370 L 245,280 Q 240,240 210,210 M 258,370 L 255,280 Q 260,240 290,210 M 245,280 L 255,280" 
          stroke="url(#goldGradient)" stroke-width="6" fill="url(#goldGradient)"/>

    <!-- Leaves / Foliage Clusters -->
    <circle cx="250" cy="180" r="45" fill="url(#emeraldGradient)" opacity="0.9"/>
    <circle cx="200" cy="210" r="35" fill="url(#emeraldGradient)" opacity="0.85"/>
    <circle cx="300" cy="210" r="35" fill="url(#emeraldGradient)" opacity="0.85"/>
    <circle cx="225" cy="150" r="30" fill="url(#emeraldGradient)" opacity="0.9"/>
    <circle cx="275" cy="150" r="30" fill="url(#emeraldGradient)" opacity="0.9"/>
  </g>

  <!-- Stars / Orbit Lines -->
  <ellipse cx="250" cy="250" rx="210" ry="80" fill="none" stroke="url(#goldGradient)" stroke-width="1" transform="rotate(-15 250 250)" opacity="0.3"/>
  <circle cx="120" cy="140" r="3" fill="#ffffff"/>
  <circle cx="380" cy="130" r="2.5" fill="#ffffff"/>
  <circle cx="390" cy="340" r="2" fill="#ffffff"/>

  <!-- Text Ring -->
  <path id="textArcTop" d="M 70,250 A 180,180 0 1,1 430,250" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#goldGradient)" letter-spacing="3">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      NEW LUNAR ACCORD • SECTOR BRAZIL
    </textPath>
  </text>

  <path id="textArcBottom" d="M 430,250 A 180,180 0 0,1 70,250" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="2" opacity="0.8">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      GLLSI • GLOBAL LIFE SUPPORT
    </textPath>
  </text>
</svg>
